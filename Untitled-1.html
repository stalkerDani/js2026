<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" id="Szam1">
    <input type="number" id="Szam2">
    <input type="number" id="Szam3">

    <button type="button" onclick="Szamol()">Végeredmény megjelenítése</button>

    <div id="uzenet">Üzenet</div>

    <script>
        function Szamol()
        {
            console.log("mukszik");

            let aOldal = document.getElementById("Szam1").value
            aOldal = parseInt(aOldal)
            console.log(aOldal);
            
            let bOldal = document.getElementById("Szam2").value
            bOldal = parseInt(bOldal);
            console.log(bOldal)

            let cOldal = document.getElementById("Szam3").value
            cOldal = parseInt(cOldal);
            console.log(cOldal)
            
            if
            (
                aOldal + bOldal > cOldal 
                && aOldal + cOldal > bOldal 
                && bOldal + cOldal > aOldal
            )
                {
                    console.log("Lehet 3szög")
                    document.getElementById("uzenet").innerHTML="Lehet 3szög"
                }
            else
                {
                    console.log("Nem lehet 3szög")
                    document.getElementById("uzenet").innerHTML="Nem lehet 3szög"
                }
            if(cOldal>aOldal && cOldal>bOldal)
            {
                if(cOldal*cOldal===aOldal*aOldal+bOldal*bOldal)
                    console.log("Derék szögű")
                else
                    {
                        console.log("Nem derék szögű")
                    }
            } 
            
            if(aOldal>cOldal && aOldal>bOldal)
            {
                if(aOldal*aOldal===cOldal*cOldal+bOldal*bOldal)
                    console.log("Derék szögű")
                else
                    {
                        console.log("Nem derék szögű")
                    }
            } 
            
            if(bOldal>aOldal && bOldal>cOldal)
            {
                if(bOldal*bOldal===aOldal*aOldal+cOldal*cOldal)
                    console.log("Derék szögű")
                else
                    {
                        console.log("Nem derék szögű")
                    }
            } 
        }
</script>
</body>
</html>
