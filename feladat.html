<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body onload="szamolas()">
    <div id="szam0"><h2>szamok</h2></div>
    <div id="szam1"><h2>1</h2></div>
    <div id="szam2"><h2>2</h2></div>
    <div id="szam3"><h2>3</h2></div>
    <div id="szam4"><h2>4</h2></div>
    <div id="szam5"><h2>5</h2></div>
    <div id="szam6"><h2>6</h2></div>
    <div id="osszeg"><H3>osszeg</H3></div>


    <script>
        function szamolas()
        {
            for(let a=0;a<=100;a++)
            {
                let maradek=a%7;
                document.getElementById("szam"+maradek).innerHTML+=a+" ";
                
            }
            
            let osszeg = 0
            for(let b=0;b<=9;b++)
            {
                osszeg+=b;
                document.getElementById("osszeg").innerHTML+=osszeg+" "

            }
        }

    </script>
</body>
</html>
