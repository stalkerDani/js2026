<body onload="letrehoz1()">
    <div class="container">
        <header class="row">
           <h1 class=" col-12 bg-success text-white text-center p-5 mb-2">Tárcsázás</h1>
        </header>
    
        <div class="row">
            <div class="col-8 container">
                
        <div class="row ">

        </div>
            <div class="col-8 container" id="bill1">

            </div>

                <div class="row">
                    <div class="col-4 border padding py-5 text-center">1</div>

    <script>
        function letrehoz1()
        {
            let b = document.getElementById("bill1");
            let szöveg = '<div class="row">'
            for (let i=0;i<3;i++)
            {
                szöveg += '<div class="col-4 border padding py-5 text-center">'+(i+1)+'</div>'
                console.log(i)
            }
            szöveg+="</div>"

            b.innerHTML=szöveg

        }
    </script>
