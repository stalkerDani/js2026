<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body onload="letrehoz1();letrehoz2();letrehozDOM()" >

    <div class="container">
        <header class="row">
            <h1 class="col-12 bg-success text-white text-center p-5 mb-2">Telefon</h1>
        </header>

        <div class="row">
            <div class="col-3 container px-5">
                <div class="row"><h2>HTML</h2></div>
                <div class="row">
                    <div class="col-4 border py-5 text-center">1</div>
                    <div class="col-4 border py-5 text-center">2</div>
                    <div class="col-4 border py-5 text-center">3</div>
                </div>
                <div class="row">
                    <div class="col-4 border py-5 text-center">4</div>
                    <div class="col-4 border py-5 text-center">5</div>
                    <div class="col-4 border py-5 text-center">6</div>
                </div>
                <div class="row">
                    <div class="col-4 border py-5 text-center">7</div>
                    <div class="col-4 border py-5 text-center">8</div>
                    <div class="col-4 border py-5 text-center">9</div>
                </div>
                <div class="row">
                    <div class="col-4 border py-5 text-center"></div>
                    <div class="col-4 border py-5 text-center">0</div>
                    <div class="col-4 border py-5 text-center"></div>
                </div>
            </div>

            <div class="col-3 container px-5" id="bill1">
                 <div class="row"><h2>innerHTML</h2></div>
            </div>

            <div class="col-3 container px-5" id="bill2">
                 <div class="row"><h2>innerHTML másként</h2></div>
            </div>

            <div class="col-3 container px-5" id="billDOM">
                 <div class="row"><h2>DOM</h2></div>
            </div>
        </div>

    

    <script>
        function letrehoz1()
        {
            let b= document.getElementById("bill1");
            let szoveg="";
            for(let k=0;k<3;k++)
            {
                szoveg+='<div class="row">';
                for(let i=0;i<3;i++)
                {
                    szoveg+='<div class="col-4 border py-5 text-center">' + (i+1+k*3) + '</div>'
                }
                szoveg+="</div>";
            }
                szoveg+='<div class="row">';
                    for(let i=0;i<3;i++)
                    {
                        if(i===1)
                        {
                             szoveg+='<div class="col-4 border py-5 text-center">0</div>';
                        }
                        else
                        {
                             szoveg+='<div class="col-4 border py-5 text-center"></div>';
                        }
                       
                    }
                    szoveg+="</div>";
                
            
            

            b.innerHTML+=szoveg;
            
        }

        function letrehoz2()
        {
            let b= document.getElementById("bill2");
            let szoveg="";
            for(let k=0;k<3;k++)
            {
               szoveg+=sorkeszit([k*3+1,k*3+2,k*3+3]);
            }
            szoveg+=sorkeszit(["",0,""]);
            b.innerHTML+=szoveg;
            
        }
        
        function letrehozDOM()
        {
           let b=document.getElementById("billDOM");
           let sor=document.createElement("div");
           sor.className="row";

                cellakeszit(1);
        }

        function cellakeszit(szam)
        {
            let cella=document.createElement("div");
            cella.className="col-4 border py-5 text-center" 
            cella.innerHTML=szam;
            return cella
        }

        function sorkeszitDOM(szamok)
        {
            let szoveg='<div class="row">';
                for(let i=0;i<3;i++)
                {
                    szoveg+='<div class="col-4 border py-5 text-center">' + szamok[i] + '</div>'
                }
                //return '<div class="row">' +
                //szamok.map(e=>'<div class="col-4 border py-5 text-center">' + e + '</div>').join("");
                //+ "</div>";
                szoveg+="</div>";

                return szoveg;
        }

        

    </script>
</body>
</html>
