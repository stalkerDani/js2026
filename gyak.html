<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Párosság</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <div class="container">
        <header class="row">
           <h1 class=" col-12 bg-success text-white text-center p-5 mb-2">Párosság</h1>
        </header>

        <div class="row">
            <div class="col-3"></div>
            <div class="col-2">
                <label for="szam">Kérek egy egész számot:</label>
            </div>
            <div class="col-3">
                <input type="number" name="szam" id="szam" class="form-control">
            </div>
            <div class="col-1">
                <button type="button" onclick="parossag()" class="btn btn-outline-warning">Küldés</button>
            </div>
            <div class="col-3"></div>
        </div>
    

        <div class="row">
            <div class="col-3"></div>
                <div class="col-3">
                    <h2>Páratlan</h2>
                <div id="paratlannok"></div>
                </div>
            <div class="col-3">
                    <h2>Páros</h2>
                <div id="parosok"></div>
            </div>
            <div class="col-3"></div>
        </div>

    </div>
    <script>
        function parossag()
        {
           let be = document.getElementById("szam");
           let beSzam = parseInt(be.value);
           
           console.log(beSzam)
           
           if(beSzam % 2 === 0)
           {
                document.getElementById("parosok").innerHTML += beSzam+" ";
           }
           else{
                document.getElementById("paratlannok").innerHTML += beSzam+" ";
           }
        }
    </script>
    
</body>
</html>
